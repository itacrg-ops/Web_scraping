# Ambiente di sviluppo locale su Docker Desktop (§11.2 del doc di deployment).
# Avvio:   cp .env.example .env  &&  docker compose -f docker-compose.dev.yml up --build
# Con SAS: docker compose -f docker-compose.dev.yml --profile sas up --build
#
# Nota: SVI/Viya non gira in locale. svi-publisher usa SVI_MODE=mock; l'LLM è
# comunque su Azure AI Foundry (configura AZURE_* nel .env per la classificazione).

name: adverse-media

services:
  # ---- Front-end: console di amministrazione (React + Vite, hot-reload) ----
  admin-console:
    image: node:20-alpine
    working_dir: /app
    # Guard: se il sorgente non è montato (/app vuoto), npm fallirebbe con un
    # criptico "ENOENT package.json". Diamo invece un messaggio azionabile.
    command:
      - sh
      - -c
      - |
        if [ ! -f /app/package.json ]; then
          echo "=============================================================="
          echo " admin-console: /app/package.json NON trovato nel container."
          echo " Il codice sorgente non risulta montato (volume ./admin-console)."
          echo " Cause tipiche:"
          echo "  1) 'docker compose' non eseguito dalla ROOT del repo"
          echo "     (dove esiste ./admin-console/package.json)."
          echo "  2) Docker Desktop: cartella del progetto non condivisa"
          echo "     (Settings -> Resources -> File Sharing)."
          echo "  3) Repository non aggiornato sull'host: esegui 'git pull'."
          echo " Verifica sull'host:  ls admin-console/package.json"
          echo "=============================================================="
          exit 1
        fi
        npm install && npm run dev -- --host
    environment:
      VITE_API_BASE: "http://localhost:8000"
      # Auth SPA: "disabled" in dev (default). "entra" attiva il login MSAL.
      VITE_AUTH_MODE: "${VITE_AUTH_MODE:-disabled}"
      VITE_ENTRA_CLIENT_ID: "${VITE_ENTRA_CLIENT_ID:-}"
      VITE_ENTRA_TENANT_ID: "${VITE_ENTRA_TENANT_ID:-}"
      VITE_ENTRA_API_SCOPE: "${VITE_ENTRA_API_SCOPE:-}"
    volumes:
      - ./admin-console:/app
      - /app/node_modules
    ports: ["5173:5173"]
    depends_on: [api]

  # ---- Back-end edge ----
  api:
    build: ./services/api
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://ams:ams@postgres:5432/ams"
      REDIS_URL: "redis://redis:6379/0"
      TEMPORAL_HOST: "temporal:7233"
      # Auth: "disabled" in dev (default). Metti "entra" nel .env per validare i JWT MSAL.
      AUTH_MODE: "${AUTH_MODE:-disabled}"
      ENTRA_TENANT_ID: "${ENTRA_TENANT_ID:-}"
      ENTRA_API_AUDIENCE: "${ENTRA_API_AUDIENCE:-}"
      # Token di servizio worker->API (POST /api/alerts). Vuoto in dev = endpoint aperto.
      INTERNAL_API_TOKEN: "${INTERNAL_API_TOKEN:-}"
      SEARCH_GATEWAY_URL: "http://search-gateway:8095"
    ports: ["8000:8000"]
    depends_on: [postgres, redis, temporal, search-gateway]

  # ---- Orchestrazione durevole (dev server in-memory, single container) ----
  temporal:
    image: temporalio/temporal:latest
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports:
      - "7233:7233"   # gRPC
      - "8233:8233"   # Web UI

  # ---- Worker di scraping (Temporal) ----
  worker-scraping:
    build: ./services/worker-scraping
    env_file: .env
    environment:
      TEMPORAL_HOST: "temporal:7233"
      REDIS_URL: "redis://redis:6379/0"
      LLM_GATEWAY_URL: "http://llm-gateway:8080"
      SVI_PUBLISHER_URL: "http://svi-publisher:8090"
      ENTITY_RESOLUTION_URL: "http://entity-resolution:8070"
      SEARCH_GATEWAY_URL: "http://search-gateway:8095"
      API_BASE: "http://api:8000"
      # Deve combaciare con l'INTERNAL_API_TOKEN dell'api per superare il gate interno.
      INTERNAL_API_TOKEN: "${INTERNAL_API_TOKEN:-}"
    depends_on: [temporal, redis, minio, llm-gateway, svi-publisher, entity-resolution, search-gateway, api]

  # ---- Gateway LLM verso Azure AI Foundry (anche in locale) ----
  llm-gateway:
    build: ./services/llm-gateway
    env_file: .env   # AZURE_FOUNDRY_ENDPOINT + credenziale dev (AZURE_TENANT_ID/CLIENT_ID/CLIENT_SECRET)
    ports: ["8080:8080"]

  # ---- Entity Resolution (gate anti-omonimia) ----
  entity-resolution:
    build: ./services/entity-resolution
    env_file: .env
    environment:
      API_URL: "http://api:8000"   # legge il registro soggetti dall'API (cache TTL)
    ports: ["8070:8070"]
    depends_on: [api]

  # ---- Search gateway (ricerca articoli adverse media) ----
  search-gateway:
    build: ./services/search-gateway
    env_file: .env   # SEARCH_PROVIDER=mock | gdelt | brave | searxng | lista "a,b,c" (fan-out B8)
    environment:
      SEARCH_PROVIDER: "${SEARCH_PROVIDER:-mock}"
      SEARXNG_URL: "http://searxng:8080"
    ports: ["8095:8095"]

  # ---- SearXNG: meta-search self-hosted (provider "searxng", keyless) ----
  # API JSON abilitata via services/search-gateway/searxng/settings.yml.
  searxng:
    image: searxng/searxng:latest
    volumes:
      - ./services/search-gateway/searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: "http://localhost:8888/"
    ports: ["8888:8080"]

  # ---- Publisher verso SAS Visual Investigator (mock in locale) ----
  svi-publisher:
    build: ./services/svi-publisher
    env_file: .env
    environment:
      SVI_MODE: "${SVI_MODE:-mock}"
    ports: ["8090:8090"]

  # ---- SAS MCP server: solo con un ambiente Viya di test (profilo "sas") ----
  sas-mcp-server:
    image: ghcr.io/sassoftware/sas-mcp-server:latest
    profiles: ["sas"]
    environment:
      VIYA_ENDPOINT: "${VIYA_ENDPOINT:-}"
      VIYA_AUTH: "true"
      ALLOW_RAW_BEARER: "true"
      MCP_TIERS: "6"
      MCP_READ_ONLY: "true"
      MCP_LANDING_PAGE: "false"
    ports: ["8134:8134"]

  # ---- Store ----
  postgres:
    image: pgvector/pgvector:pg16   # PostgreSQL 16 con estensione pgvector
    environment:
      POSTGRES_USER: ams
      POSTGRES_PASSWORD: ams
      POSTGRES_DB: ams
    volumes: ["pgdata:/var/lib/postgresql/data"]
    ports: ["5432:5432"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    volumes: ["minio:/data"]
    ports:
      - "9000:9000"   # S3 API (snapshot WARC/HTML)
      - "9001:9001"   # console MinIO

volumes:
  pgdata: {}
  minio: {}
