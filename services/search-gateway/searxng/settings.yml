# SearXNG per il pilota adverse-media (provider "searxng").
# Punto chiave: abilitare il formato **JSON** dell'API (di default disattivato),
# così il search-gateway può consumare i risultati via /search?format=json.
#
# Motori: quelli di default della versione nel Dockerfile, meno quelli che bloccano le
# richieste automatiche (solo errori e tempo perso), più Il Post (ricerca nel proprio
# archivio, spento di default). Il search-gateway interroga le categorie "general" (web:
# Google tramite Custom Search, DuckDuckGo, Brave) e "news" (Google News, Bing News,
# DuckDuckGo News, Brave News, Il Post): i motori di sole notizie restituiscono
# soprattutto articoli recenti. ANSA resta spento: la sua ricerca risponde con errori
# HTTP alle richieste di SearXNG.
use_default_settings:
  engines:
    remove:
      - startpage        # CAPTCHA
      - startpage news   # CAPTCHA

server:
  # In locale va bene un segreto statico; in produzione usare un secret gestito.
  secret_key: "adverse-media-dev-secret-change-me"
  limiter: false
  image_proxy: false

search:
  formats:
    - html
    - json
  safe_search: 0
  # Lingua di default coerente col pilota.
  default_lang: "it"

engines:
  - name: il post
    engine: il_post
    shortcut: pst
    disabled: false
